name: psy_trainer
description: "Unofficial trainer for the Air France cadet selection psychometric tests."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

# Part of the psy_trainer_workspace pub workspace (US-007): resolved together
# with every other member from the single lockfile at the repo root
# (`dart pub get` at the root, not here).
resolution: workspace

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Content models, parser and validator (US-007): packages/psy_content.
  psy_content:
    path: ../../packages/psy_content

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.31.0
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  sqlite3: ^3.5.2
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  drift_dev: ^2.31.0
  # Deterministic time in unit tests (see docs/TESTING.md).
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # No Material or Cupertino in this project: do not bundle the Material icon font.
  uses-material-design: false

  # Content bundle (US-013). Flutter registers assets per directory, not
  # recursively, so every folder holding content files must be listed here
  # (`assets/content/examples/` is deliberately left out: the examples are
  # fixtures for tests and authors, not shipped content).
  #
  # When you add a family folder, a `lessons/<family>/` folder, `items/`,
  # `decks/` or `lexical_fields/` under a family, regenerate this list (from
  # the repo root):
  #
  #   dart run tools/list_content_assets.dart          # prints the list
  #   dart run tools/list_content_assets.dart --check  # verifies this file
  #
  # `tools/test/list_content_assets_test.dart` fails when the list is stale.
  # BEGIN content assets (generated by tools/list_content_assets.dart)
  assets:
    - assets/content/
    - assets/content/psy0/
    - assets/content/psy0/arithmetic_grid/
    - assets/content/psy0/arithmetic_grid/decks/
    - assets/content/psy0/attention_airways/
    - assets/content/psy0/attention_parity/
    - assets/content/psy0/attention_rules/
    - assets/content/psy0/attention_rules/decks/
    - assets/content/psy0/blueprints/
    - assets/content/psy0/culture_aero/
    - assets/content/psy0/culture_aero/decks/
    - assets/content/psy0/culture_aero/items/
    - assets/content/psy0/english/
    - assets/content/psy0/english/decks/
    - assets/content/psy0/english/items/
    - assets/content/psy0/english_listening/
    - assets/content/psy0/english_speaking/
    - assets/content/psy0/lessons/
    - assets/content/psy0/lessons/arithmetic_grid/
    - assets/content/psy0/lessons/attention_airways/
    - assets/content/psy0/lessons/attention_parity/
    - assets/content/psy0/lessons/attention_rules/
    - assets/content/psy0/lessons/culture_aero/
    - assets/content/psy0/lessons/english/
    - assets/content/psy0/lessons/logic_dominos/
    - assets/content/psy0/lessons/memory_nback/
    - assets/content/psy0/lessons/multitask_psychomotor/
    - assets/content/psy0/lessons/planning_tubes/
    - assets/content/psy0/lessons/selection_process/
    - assets/content/psy0/lessons/spatial_cubes/
    - assets/content/psy0/lessons/spatial_overlay/
    - assets/content/psy0/lessons/spatial_viewpoint/
    - assets/content/psy0/lessons/verbal_boxes/
    - assets/content/psy0/logic_dominos/
    - assets/content/psy0/logic_dominos/decks/
    - assets/content/psy0/logic_dominos/items/
    - assets/content/psy0/memory_nback/
    - assets/content/psy0/memory_nback/decks/
    - assets/content/psy0/multitask_psychomotor/
    - assets/content/psy0/planning_tubes/
    - assets/content/psy0/spatial_cubes/
    - assets/content/psy0/spatial_cubes/items/
    - assets/content/psy0/spatial_overlay/
    - assets/content/psy0/spatial_viewpoint/
    - assets/content/psy0/spatial_viewpoint/items/
    - assets/content/psy0/verbal_boxes/
    - assets/content/psy0/verbal_boxes/lexical_fields/
  # END content assets

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# App icon (US-122). Source PNG generated from tools/branding/generate_icon.dart
# (see tools/branding/icon.svg for the readable design reference) and committed
# at assets/branding/icon.png. Regenerate with:
#   dart run tools/branding/generate_icon.dart
#   cp tools/branding/out/icon_1024.png apps/psy_trainer/assets/branding/icon.png
#   cp tools/branding/out/splash_1024.png apps/psy_trainer/assets/branding/splash_logo.png
# then re-run `dart run flutter_launcher_icons` and
# `dart run flutter_native_splash:create` from apps/psy_trainer.
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#0B1D3A"
    theme_color: "#0B1D3A"
  image_path: assets/branding/icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

# Splash screen (US-122): the aircraft/ring mark on the design system's
# deep-blue background token, shown while the content seeder runs
# (see docs/ARCHITECTURE.md "Startup sequence" — StartupGate/SplashScreen).
flutter_native_splash:
  color: "#0B1D3A"
  image: assets/branding/splash_logo.png
  color_dark: "#0B1D3A"
  image_dark: assets/branding/splash_logo.png
  android_12:
    color: "#0B1D3A"
    image: assets/branding/splash_logo.png
    color_dark: "#0B1D3A"
    image_dark: assets/branding/splash_logo.png
  web: true
  android: true
  ios: true
