name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

# One run per PR / branch; a newer push cancels the superseded run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Fetch packages
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        # Same scope as `make lint`; generated files are emitted formatted.
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Validate content
        # Added by US-014; skipped until the validator exists.
        run: |
          if [ -f tool/validate_content.dart ]; then
            dart run tool/validate_content.dart
          else
            echo "tool/validate_content.dart not present, skipping content validation"
          fi

      - name: Test
        run: flutter test --coverage

      - name: Upload golden failures
        # Golden mismatches write <name>_masterImage/_testImage/_isolatedDiff
        # PNGs; publish them so the diff can be reviewed (and a golden
        # regenerated from the Linux rendering when the change is intended).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/goldens/failures
          if-no-files-found: ignore
          retention-days: 14

      - name: Coverage gate
        run: dart run tool/coverage_gate.dart --min 70

      - name: Build web
        # Web is an exam-mode target (US-006); a release build is fast enough to
        # run on every PR. Desktop builds are not run in CI.
        run: flutter build web --release

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  build-android:
    name: build-android
    needs: check
    # Only on pushes to main, or on PRs carrying the `build` label.
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Fetch packages
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
