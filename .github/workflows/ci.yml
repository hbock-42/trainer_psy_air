name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

# One run per PR / branch; a newer push cancels the superseded run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      # US-007: pub workspace, single pubspec.lock at the root resolves the
      # app (apps/psy_trainer) and the content package (packages/psy_content)
      # together.
      - name: Fetch packages (whole workspace)
        run: dart pub get

      - name: Code generation
        run: |
          (cd apps/psy_trainer && dart run build_runner build --delete-conflicting-outputs)
          (cd packages/psy_content && dart run build_runner build --delete-conflicting-outputs)

      - name: Format check
        # Same scope as `make lint`; generated files are emitted formatted.
        run: |
          dart format --output=none --set-exit-if-changed apps/psy_trainer/lib apps/psy_trainer/test apps/psy_trainer/integration_test tools
          dart format --output=none --set-exit-if-changed packages/psy_content/lib packages/psy_content/test packages/psy_content/bin

      - name: Analyze
        run: |
          (cd apps/psy_trainer && flutter analyze --fatal-infos)
          (cd packages/psy_content && dart analyze --fatal-infos)

      - name: Validate content
        run: dart run psy_content:validate_content apps/psy_trainer/assets/content

      - name: Test
        run: |
          (cd apps/psy_trainer && flutter test --coverage)
          (cd packages/psy_content && dart test)
          dart test tools/test

      - name: Upload golden failures
        # Golden mismatches write <name>_masterImage/_testImage/_isolatedDiff
        # PNGs; publish them so the diff can be reviewed (and a golden
        # regenerated from the Linux rendering when the change is intended).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: apps/psy_trainer/test/goldens/failures
          if-no-files-found: ignore
          retention-days: 14

      - name: Coverage gate
        run: dart run tools/coverage_gate.dart --file apps/psy_trainer/coverage/lcov.info --min 70

      - name: Build web
        # Web is an exam-mode target (US-006); a release build is fast enough to
        # run on every PR. Desktop builds are not run in CI.
        run: cd apps/psy_trainer && flutter build web --release

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/psy_trainer/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: integration
    needs: check
    continue-on-error: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Fetch packages (whole workspace)
        run: dart pub get

      - name: Code generation
        run: |
          (cd apps/psy_trainer && dart run build_runner build --delete-conflicting-outputs)
          (cd packages/psy_content && dart run build_runner build --delete-conflicting-outputs)

      # US-121: the full practice/exam flow against the real seeded content
      # (an in-memory Drift database, real assets read from disk) and the
      # real engines. Run through `flutter_tester` (`-d flutter-tester`), the
      # same headless, windowless host Flutter uses for `flutter test`: this
      # widgets-only app (no Material/Cupertino, no platform channel besides
      # the asset bundle, which the test bypasses with a `FileAssetReader`
      # over `assets/content/` on disk) needs no real device or `Xvfb` to
      # exercise every screen the same way a Linux desktop or Chrome run
      # would, for a much lighter and less brittle job.
      - name: Integration test
        run: cd apps/psy_trainer && flutter test integration_test -d flutter-tester

  build-android:
    name: build-android
    needs: check
    # Runs on every PR too: a job that only runs on main can only ever turn
    # main red after the fact.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Fetch packages (whole workspace)
        run: dart pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/psy_trainer

      - name: Build debug APK
        run: flutter build apk --debug
        working-directory: apps/psy_trainer

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/psy_trainer/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
